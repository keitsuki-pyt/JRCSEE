<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Choose Account Role | JRCSEE</title>
    <link rel="icon" type="image/x-icon" href="JRCC.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            font-family: "Poppins", sans-serif;
            color: #fff;
            background: #05030a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(112, 35, 189, .25), transparent 42%),
                radial-gradient(ellipse at 85% 85%, rgba(36, 87, 153, .16), transparent 42%),
                #05030a;
        }

        main {
            width: min(100%, 480px);
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 16px;
            background: rgba(22, 12, 36, .84);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .4);
        }

        h1 {
            margin: 0;
            font: 800 32px/1.1 "Barlow Condensed", sans-serif;
            letter-spacing: .02em;
        }

        p {
            color: #bcb1cf;
            line-height: 1.6;
        }

        #accountEmail {
            overflow-wrap: anywhere;
            color: #e9d5ff;
            font-size: 13px;
        }

        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 24px 0 14px;
        }

        button,
        a {
            min-height: 46px;
            border-radius: 8px;
            font: 600 14px "Poppins", sans-serif;
        }

        button {
            border: 1px solid rgba(255, 255, 255, .18);
            color: #fff;
            background: rgba(255, 255, 255, .07);
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            border-color: #a855f7;
            background: rgba(168, 85, 247, .18);
        }

        button:disabled {
            cursor: wait;
            opacity: .6;
        }

        #message {
            min-height: 24px;
            margin: 16px 0;
            color: #fca5a5;
            font-size: 13px;
        }

        #message:empty {
            display: none;
        }

        #setupHelp {
            display: none;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, .06);
            font-size: 13px;
        }

        #setupHelp a,
        .back-link {
            color: #d8b4fe;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-top: 6px;
            text-decoration: none;
        }

        @media (max-width: 420px) {
            main {
                padding: 24px;
            }

            .roles {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1 id="pageTitle">CHECKING YOUR ACCOUNT</h1>
        <p id="pageDescription">Please wait while we check your account approval status.</p>
        <div id="accountEmail"></div>
        <div id="message" role="alert" aria-live="polite"></div>
        <div id="setupHelp">
            Supabase profile setup appears incomplete. Run the current
            <a href="./supabase-setup.sql" target="_blank" rel="noopener">supabase-setup.sql</a>
            in the Supabase SQL Editor, then sign in again.
        </div>
        <a class="back-link" href="./index.html" id="returnLink">Return to sign in</a>
    </main>

    <script>
        const supabaseClient = window.supabase.createClient(
            "https://guhwlwhdssycjpobcmfk.supabase.co",
            "sb_publishable_7pWS_7AO3bfuqLhh5Gp_AA_Wn0cuUyB"
        );

        const message = document.getElementById("message");
        const setupHelp = document.getElementById("setupHelp");

        async function initializeApprovalStatus() {
            try {
                const { data, error } = await supabaseClient.auth.getSession();
                if (error) throw error;
                const user = data.session?.user;

                if (!user) {
                    window.location.replace("./index.html");
                    return;
                }
                if (user.app_metadata?.provider !== "google") {
                    throw new Error("This page is only available after Google sign-in.");
                }

                document.getElementById("accountEmail").textContent = user.email || "";
                const { data: profile, error: profileError } = await supabaseClient
                    .from("profiles")
                    .select("role")
                    .eq("id", user.id)
                    .maybeSingle();
                if (profileError) throw profileError;
                if (!profile) {
                    setupHelp.style.display = "block";
                    throw new Error("Your account profile could not be found. Please contact an administrator.");
                }

                if (["admin", "personnel"].includes(profile.role)) {
                    window.location.replace("./dashboard.html");
                    return;
                }
                if (profile.role !== "pending") {
                    throw new Error("Your account has an invalid role. Please contact an administrator.");
                }

                document.getElementById("pageTitle").textContent = "ACCOUNT PENDING APPROVAL";
                document.getElementById("pageDescription").textContent =
                    "Your Google account is verified, but dashboard access requires administrator approval.";
                message.textContent =
                    "An administrator must assign you the Personnel or Admin role in Supabase. Once approved, sign in again to access the dashboard.";
            } catch (error) {
                console.error("Could not check Google account approval:", error);
                if (!message.textContent) {
                    document.getElementById("pageTitle").textContent = "ACCOUNT STATUS UNAVAILABLE";
                    document.getElementById("pageDescription").textContent =
                        "We could not verify your approval status.";
                    message.textContent = error.message || "Could not check your account. Please try again.";
                }
            }
        }

        document.getElementById("returnLink").addEventListener("click", async event => {
            event.preventDefault();
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
                sessionStorage.removeItem("jrcsee_requested_role");
                sessionStorage.removeItem("jrcsee_google_role_selection");
                window.location.replace("./index.html");
            } catch (error) {
                console.error("Could not sign out:", error);
                message.textContent = `Could not sign out: ${error.message || "Please try again."}`;
            }
        });

        initializeApprovalStatus();
    </script>
</body>

</html>
