<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRCSEE Login</title>
    <link rel="icon" type="image/x-icon" href="JRCC.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: "Poppins", sans-serif;
            overflow: hidden;
        }

        /* ================= BACKGROUND ================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            background: #000;
        }

        .shape {
            position: absolute;
            width: 520px;
            height: 110px;
            background: linear-gradient(90deg, #08030f, #18052d, #08030f);
            transform: rotate(-50deg);
            opacity: .9;
            animation: floatShape 7s ease-in-out infinite alternate;
        }

        .shape::after {
            content: "";
            position: absolute;
            right: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: #7428ff;
            box-shadow:
                0 0 10px #7428ff,
                0 0 25px #7428ff,
                0 0 45px #4d00ff;
        }

        .shape1 {
            left: -160px;
            top: 20px;
        }

        .shape2 {
            right: -190px;
            top: 180px;
            animation-delay: -2s;
        }

        .shape3 {
            left: -170px;
            bottom: 40px;
            animation-delay: -4s;
        }

        .shape4 {
            right: -170px;
            bottom: 70px;
            animation-delay: -1s;
        }

        @keyframes floatShape {
            from {
                transform: rotate(-50deg) translateY(0);
            }

            to {
                transform: rotate(-50deg) translateY(25px);
            }
        }

        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(105, 25, 255, .16), transparent 70%);
            filter: blur(20px);
            animation: glowMove 8s ease-in-out infinite alternate;
        }

        .glow1 {
            left: -250px;
            top: -200px;
        }

        .glow2 {
            right: -250px;
            bottom: -200px;
            animation-delay: -4s;
        }

        @keyframes glowMove {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.3) translate(40px, 20px);
            }
        }

        .dots {
            position: absolute;
            width: 110px;
            height: 190px;
            background-image: radial-gradient(circle, #6520ff 2px, transparent 2.5px);
            background-size: 25px 25px;
            animation: dotMove 4s ease-in-out infinite;
        }

        .dots.left {
            left: 15px;
            top: 410px;
        }

        .dots.right {
            right: 15px;
            top: 30px;
        }

        @keyframes dotMove {

            0%,
            100% {
                opacity: .35;
                transform: translateY(0);
            }

            50% {
                opacity: .9;
                transform: translateY(10px);
            }
        }

        /* ================= MAIN ================= */

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .logo {
            width: 125px;
            height: 125px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 5px rgba(255, 200, 50, .15));
        }

        .title {
            font-family: "Barlow Condensed", sans-serif;
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 22px;
            letter-spacing: .5px;
        }

        /* ================= LOGIN CARD ================= */

        .login-card {
            width: 540px;
            max-width: 92%;
            padding: 18px 24px 20px;
            border-radius: 16px;
            background: rgba(8, 8, 13, .82);
            border: 2px solid rgba(105, 40, 210, .55);
            box-shadow:
                0 0 25px rgba(95, 30, 220, .08),
                inset 0 0 20px rgba(100, 30, 200, .03);
            backdrop-filter: blur(15px);
        }

        .label {
            font-size: 15px;
            margin-bottom: 7px;
        }

        /* ================= ROLES ================= */

        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .role {
            height: 52px;
            border: 2px solid #3b3b42;
            border-radius: 9px;
            display: flex;
            align-items: center;
            padding: 0 11px;
            cursor: pointer;
            transition: .25s;
        }

        .role:hover {
            border-color: #762cff;
        }

        .role.active {
            border-color: #7428ff;
            box-shadow: 0 0 12px rgba(115, 40, 255, .25);
        }

        .role-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 9px;
            font-size: 18px;
            color: white;
        }

        .role.active .role-icon {
            background: #6e25d9;
            box-shadow: 0 0 12px rgba(120, 40, 255, .5);
        }

        .role-name {
            font-size: 16px;
            font-weight: 500;
            flex: 1;
        }

        .radio {
            width: 20px;
            height: 20px;
            border: 2px solid #66666d;
            border-radius: 50%;
            position: relative;
        }

        .role.active .radio {
            border-color: #9b64ff;
            box-shadow: 0 0 8px rgba(130, 60, 255, .7);
        }

        .role.active .radio::after {
            content: "";
            position: absolute;
            width: 9px;
            height: 9px;
            background: white;
            border-radius: 50%;
            top: 3.5px;
            left: 3.5px;
        }

        /* ================= INPUT ================= */

        .input-group {
            margin-bottom: 11px;
        }

        .input-box {
            height: 48px;
            width: 100%;
            border: 2px solid #414147;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 11px;
            transition: .25s;
        }

        .input-box:focus-within {
            border-color: #7029e8;
            box-shadow: 0 0 10px rgba(100, 30, 230, .2);
        }

        .input-icon {
            width: 32px;
            font-size: 19px;
            color: #ddd;
        }

        .input-box input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 14px;
            font-family: "Poppins", sans-serif;
        }

        .input-box input::placeholder {
            color: #77777d;
        }

        /* Keep saved/autofilled credentials dark in Chromium browsers */
        .input-box input,
        .input-box input:focus,
        .input-box input:-webkit-autofill,
        .input-box input:-webkit-autofill:hover,
        .input-box input:-webkit-autofill:focus,
        .input-box input:-webkit-autofill:active {
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
            caret-color: #fff;
            color-scheme: dark;
        }
        .input-box input:-webkit-autofill,
        .input-box input:-webkit-autofill:hover,
        .input-box input:-webkit-autofill:focus,
        .input-box input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #0b0712 inset !important;
            box-shadow: 0 0 0 1000px #0b0712 inset !important;
            transition: background-color 99999s ease-out 0s;
            border-radius: 6px;
        }

        .eye {
            font-size: 19px;
            cursor: pointer;
            color: #ddd;
            user-select: none;
        }

        /* ================= OPTIONS ================= */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 3px 0 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .remember input {
            width: 18px;
            height: 18px;
            accent-color: #7028e8;
        }

        .forgot {
            color: #8a3cff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* ================= LOGIN BUTTON ================= */

        .login-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #5420c9, #7027e9, #5720cc);
            color: white;
            font-size: 18px;
            font-weight: 700;
            font-family: "Poppins", sans-serif;
            cursor: pointer;
            transition: .25s;
            box-shadow: 0 0 20px rgba(100, 30, 230, .15);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(110, 35, 240, .4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: .7;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .button-spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
        .login-btn.loading .button-spinner { display: inline-block; }
        .login-btn.loading .button-label { letter-spacing: .03em; }

        /* ================= INTRO + LOADING ================= */
        .intro-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #05030a;
            transition: opacity .65s ease, visibility .65s ease;
        }
        .intro-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        .intro-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: rgba(112, 39, 233, .18);
            filter: blur(70px);
            animation: introPulse 1.8s ease-in-out infinite alternate;
        }
        .intro-logo {
            position: relative;
            width: 115px;
            height: 115px;
            object-fit: contain;
            opacity: 0;
            animation: introRise .75s .12s ease forwards;
            filter: drop-shadow(0 0 22px rgba(116, 40, 255, .35));
        }
        .intro-brand {
            position: relative;
            margin-top: 12px;
            font: 800 clamp(42px, 8vw, 64px)/1 "Barlow Condensed", sans-serif;
            letter-spacing: .16em;
            background: linear-gradient(110deg, #fff, #c8a8ff, #fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0;
            animation: introRise .75s .28s ease forwards;
        }
        .intro-subtitle {
            position: relative;
            margin-top: 10px;
            color: #a69bbd;
            font-size: 10px;
            letter-spacing: .28em;
            opacity: 0;
            animation: introRise .75s .42s ease forwards;
        }
        .intro-progress { position: relative; width: 150px; height: 2px; margin-top: 32px; overflow: hidden; background: #241536; border-radius: 9px; }
        .intro-progress span { display: block; width: 45%; height: 100%; background: #a855f7; box-shadow: 0 0 12px #a855f7; animation: introLoad 1.25s ease-in-out infinite; }
        @keyframes introRise { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes introPulse { from { transform: scale(.85); opacity: .55; } to { transform: scale(1.15); opacity: 1; } }
        @keyframes introLoad { from { transform: translateX(-110%); } to { transform: translateX(340%); } }
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(3, 1, 8, .78);
            backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s ease, visibility .2s ease;
        }
        .loading-overlay.show { opacity: 1; visibility: visible; }
        .loading-panel {
            width: min(330px, 100%);
            padding: 28px 24px;
            text-align: center;
            background: rgba(13, 7, 23, .96);
            border: 1px solid rgba(168, 85, 247, .45);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(112, 39, 233, .2);
        }
        .loading-spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 16px;
            border: 3px solid rgba(168, 85, 247, .2);
            border-top-color: #c084fc;
            border-right-color: #7027e9;
            border-radius: 50%;
            animation: spin .75s linear infinite;
        }
        .loading-title { font-weight: 700; letter-spacing: .06em; }
        .loading-message { margin-top: 7px; color: #a69bbd; font-size: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .intro-glow, .intro-logo, .intro-brand, .intro-subtitle, .intro-progress span, .loading-spinner { animation-duration: 2s; }
        }

        /* ================= SMALL SCREENS ================= */

        @media (max-width: 700px) {
            .logo {
                width: 95px;
                height: 95px;
            }

            .title {
                font-size: 30px;
                margin-bottom: 18px;
            }

            .login-card {
                width: 100%;
                padding: 15px;
            }

            .roles {
                gap: 8px;
            }

            .role {
                height: 48px;
            }

            .role-name {
                font-size: 14px;
            }

            .role-icon {
                font-size: 16px;
                margin-right: 6px;
            }

            .label {
                font-size: 14px;
            }

            .remember {
                font-size: 13px;
            }

            .forgot {
                font-size: 13px;
            }

            .login-btn {
                height: 48px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body class="intro-active">
    <!-- INTRO SPLASH -->
    <div class="intro-screen" id="introScreen" aria-label="JRCSEE welcome screen">
        <div class="intro-glow"></div>
        <img src="JRCC.png" class="intro-logo" alt="JRCC Logo">
        <div class="intro-brand">JRCSEE</div>
        <div class="intro-subtitle">FACE RECOGNITION WEB</div>
        <div class="intro-progress"><span></span></div>
    </div>

    <!-- LOGIN LOADING OVERLAY -->
    <div class="loading-overlay" id="loadingOverlay" aria-live="polite" aria-hidden="true">
        <div class="loading-panel">
            <div class="loading-spinner"></div>
            <div class="loading-title">Authenticating</div>
            <div class="loading-message">Please wait while we securely sign you in.</div>
        </div>
    </div>

    <!-- ANIMATED BACKGROUND -->
    <div class="background">
        <div class="glow glow1"></div>
        <div class="glow glow2"></div>

        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
        <div class="shape shape4"></div>

        <div class="dots left"></div>
        <div class="dots right"></div>
    </div>

    <!-- MAIN -->
    <div class="container">

        <img src="JRCC.png" class="logo" alt="JRCC Logo">

        <h1 class="title">JRCSEE Login</h1>

        <div class="login-card">

            <div class="label">Role</div>

            <div class="roles">
                <div class="role active" onclick="selectRole(this)">
                    <div class="role-icon">♙</div>
                    <div class="role-name">Admin</div>
                    <div class="radio"></div>
                </div>

                <div class="role" onclick="selectRole(this)">
                    <div class="role-icon">♙</div>
                    <div class="role-name">Personnel</div>
                    <div class="radio"></div>
                </div>
            </div>

            <!-- EMAIL -->
            <div class="input-group">
                <div class="label">Email</div>
                <div class="input-box">
                    <div class="input-icon">♙</div>
                    <input type="email" id="username" placeholder="Email" autocomplete="username">
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="input-group">
                <div class="label">Password</div>
                <div class="input-box">
                    <div class="input-icon">🔒</div>
                    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
                    <div class="eye" onclick="togglePassword()" id="eye">◉</div>
                </div>
            </div>

            <!-- OPTIONS -->
            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <div class="forgot" onclick="forgotPassword()">Forgot password?</div>
            </div>

            <button class="login-btn" id="loginButton" onclick="login()"><span class="button-label">LOGIN</span><span class="button-spinner" aria-hidden="true"></span></button>

        </div>
    </div>

    <script>
        /* ================= SUPABASE ================= */

        const supabaseClient = window.supabase.createClient(
            "https://guhwlwhdssycjpobcmfk.supabase.co",
            "sb_publishable_7pWS_7AO3bfuqLhh5Gp_AA_Wn0cuUyB"
        );

        /* ================= ROLE ================= */

        let selectedRole = "admin";

        function selectRole(element) {
            document.querySelectorAll(".role").forEach(role => {
                role.classList.remove("active");
            });

            element.classList.add("active");

            selectedRole = element
                .querySelector(".role-name")
                .textContent.trim()
                .toLowerCase();
        }

        /* ================= PASSWORD ================= */

        function togglePassword() {
            const password = document.getElementById("password");
            password.type = password.type === "password" ? "text" : "password";
        }

        /* ================= LOGIN ================= */

        async function login() {
            const email = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const button = document.getElementById("loginButton");
            const overlay = document.getElementById("loadingOverlay");

            if (!email || !password) {
                alert("Please enter your email and password.");
                return;
            }

            button.disabled = true;
            button.classList.add("loading");
            button.querySelector(".button-label").textContent = "SIGNING IN...";
            overlay.classList.add("show");
            overlay.setAttribute("aria-hidden", "false");

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                // Store the selected role for the dashboard profile label.
                localStorage.setItem("jrcsee_role", selectedRole);
                window.location.replace("./dashboard.html");
            } catch (err) {
                console.error("Login error:", err);
                overlay.classList.remove("show");
                overlay.setAttribute("aria-hidden", "true");
                alert("Login failed: " + (err.message || "Unable to connect to Supabase."));
                button.disabled = false;
                button.classList.remove("loading");
                button.querySelector(".button-label").textContent = "LOGIN";
            }
        }

        /* ================= FORGOT PASSWORD ================= */

        async function forgotPassword() {
            const email = document.getElementById("username").value.trim();

            if (!email) {
                alert("Enter your email first, then click 'Forgot password?'.");
                return;
            }

            const { error } = await supabaseClient.auth.resetPasswordForEmail(email);

            if (error) {
                alert("Could not send reset email: " + error.message);
                return;
            }

            alert("Password reset email sent. Check your inbox.");
        }

        /* ================= ENTER KEY ================= */

        document.addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.repeat) {
                e.preventDefault();
                login();
            }
        });

        // Brief branded intro, then reveal the login page.
        window.addEventListener("DOMContentLoaded", () => {
            const intro = document.getElementById("introScreen");
            window.setTimeout(() => {
                intro.classList.add("hide");
                document.body.classList.remove("intro-active");
                window.setTimeout(() => intro.remove(), 700);
            }, 1750);
        });
    </script>

</body>

</html>
