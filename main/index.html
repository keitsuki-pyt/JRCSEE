<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JRCSEE Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #000;
    color: white;
    font-family: "Poppins", sans-serif;
    overflow: hidden;
}

/* ================= BACKGROUND ================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    background: #000;
}

/* Purple diagonal shapes */

.shape {
    position: absolute;
    width: 520px;
    height: 110px;

    background: linear-gradient(
        90deg,
        #08030f,
        #18052d,
        #08030f
    );

    transform: rotate(-50deg);
    opacity: .9;

    animation: floatShape 7s ease-in-out infinite alternate;
}

.shape::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;

    width: 4px;
    height: 100%;

    background: #7428ff;

    box-shadow:
        0 0 10px #7428ff,
        0 0 25px #7428ff,
        0 0 45px #4d00ff;
}

.shape1 {
    left: -160px;
    top: 20px;
}

.shape2 {
    right: -190px;
    top: 180px;
    animation-delay: -2s;
}

.shape3 {
    left: -170px;
    bottom: 40px;
    animation-delay: -4s;
}

.shape4 {
    right: -170px;
    bottom: 70px;
    animation-delay: -1s;
}

@keyframes floatShape {
    from {
        transform: rotate(-50deg) translateY(0);
    }

    to {
        transform: rotate(-50deg) translateY(25px);
    }
}

/* Purple glowing lights */

.glow {
    position: absolute;
    width: 500px;
    height: 500px;

    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(105, 25, 255, .16),
        transparent 70%
    );

    filter: blur(20px);

    animation: glowMove 8s ease-in-out infinite alternate;
}

.glow1 {
    left: -250px;
    top: -200px;
}

.glow2 {
    right: -250px;
    bottom: -200px;
    animation-delay: -4s;
}

@keyframes glowMove {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.3) translate(40px, 20px);
    }
}

/* Dots */

.dots {
    position: absolute;

    width: 110px;
    height: 190px;

    background-image: radial-gradient(
        circle,
        #6520ff 2px,
        transparent 2.5px
    );

    background-size: 25px 25px;

    animation: dotMove 4s ease-in-out infinite;
}

.dots.left {
    left: 15px;
    top: 410px;
}

.dots.right {
    right: 15px;
    top: 30px;
}

@keyframes dotMove {
    0%,100% {
        opacity: .35;
        transform: translateY(0);
    }

    50% {
        opacity: .9;
        transform: translateY(10px);
    }
}

/* ================= MAIN ================= */

.container {
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 20px;
}

/* ================= LOGO ================= */

.logo {
    width: 205px;
    height: 205px;

    object-fit: contain;

    margin-bottom: 15px;

    filter:
        drop-shadow(0 0 5px rgba(255,200,50,.15));
}

/* ================= TITLE ================= */

.title {
    font-family: "Barlow Condensed", sans-serif;

    font-size: 56px;
    font-weight: 800;

    margin-bottom: 45px;

    letter-spacing: .5px;
}

/* ================= LOGIN CARD ================= */

.login-card {
    width: 735px;
    max-width: 95%;

    padding: 22px 33px 25px;

    border-radius: 20px;

    background: rgba(8,8,13,.82);

    border: 2px solid rgba(105,40,210,.55);

    box-shadow:
        0 0 25px rgba(95,30,220,.08),
        inset 0 0 20px rgba(100,30,200,.03);

    backdrop-filter: blur(15px);
}

/* ================= LABEL ================= */

.label {
    font-size: 20px;
    margin-bottom: 10px;
}

/* ================= ROLES ================= */

.roles {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 25px;

    margin-bottom: 17px;
}

.role {
    height: 70px;

    border: 2px solid #3b3b42;
    border-radius: 12px;

    display: flex;
    align-items: center;

    padding: 0 15px;

    cursor: pointer;

    transition: .25s;
}

.role:hover {
    border-color: #762cff;
}

.role.active {
    border-color: #7428ff;

    box-shadow:
        0 0 12px rgba(115,40,255,.25);
}

/* role icon */

.role-icon {
    width: 45px;
    height: 45px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 15px;

    font-size: 24px;

    color: white;
}

.role.active .role-icon {
    background: #6e25d9;

    box-shadow:
        0 0 12px rgba(120,40,255,.5);
}

.role-name {
    font-size: 21px;
    font-weight: 500;

    flex: 1;
}

/* radio */

.radio {
    width: 27px;
    height: 27px;

    border: 2px solid #66666d;

    border-radius: 50%;

    position: relative;
}

.role.active .radio {
    border-color: #9b64ff;

    box-shadow:
        0 0 8px rgba(130,60,255,.7);
}

.role.active .radio::after {
    content: "";

    position: absolute;

    width: 12px;
    height: 12px;

    background: white;

    border-radius: 50%;

    top: 5px;
    left: 5px;
}

/* ================= INPUT ================= */

.input-group {
    margin-bottom: 15px;
}

.input-box {
    height: 61px;

    width: 100%;

    border: 2px solid #414147;

    border-radius: 10px;

    display: flex;
    align-items: center;

    padding: 0 15px;

    transition: .25s;
}

.input-box:focus-within {
    border-color: #7029e8;

    box-shadow:
        0 0 10px rgba(100,30,230,.2);
}

.input-icon {
    width: 40px;

    font-size: 24px;

    color: #ddd;
}

.input-box input {
    flex: 1;

    height: 100%;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    font-size: 17px;

    font-family: "Poppins", sans-serif;
}

.input-box input::placeholder {
    color: #77777d;
}

/* eye */

.eye {
    font-size: 23px;

    cursor: pointer;

    color: #ddd;
}

/* ================= OPTIONS ================= */

.options {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin: 4px 0 20px;
}

.remember {
    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 16px;

    font-weight: 600;
}

.remember input {
    width: 25px;
    height: 25px;

    accent-color: #7028e8;
}

.forgot {
    color: #8a3cff;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;
}

/* ================= LOGIN BUTTON ================= */

.login-btn {
    width: 100%;
    height: 64px;

    border: none;

    border-radius: 9px;

    background: linear-gradient(
        90deg,
        #5420c9,
        #7027e9,
        #5720cc
    );

    color: white;

    font-size: 25px;

    font-weight: 700;

    font-family: "Poppins", sans-serif;

    cursor: pointer;

    transition: .25s;

    box-shadow:
        0 0 20px rgba(100,30,230,.15);
}

.login-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 0 30px rgba(110,35,240,.4);
}

.login-btn:active {
    transform: translateY(0);
}

/* ================= RESPONSIVE ================= */

@media(max-width: 700px) {

    .logo {
        width: 150px;
        height: 150px;
    }

    .title {
        font-size: 42px;
        margin-bottom: 30px;
    }

    .login-card {
        padding: 20px;
    }

    .roles {
        gap: 10px;
    }

    .role-name {
        font-size: 16px;
    }

    .role-icon {
        margin-right: 8px;
    }

    .forgot {
        font-size: 13px;
    }

    .remember {
        font-size: 13px;
    }
}

/* ================= COMPACT LOGIN SIZE ================= */

.container {
    min-height: 100vh;
    padding: 15px;
}

/* LOGO */
.logo {
    width: 125px;
    height: 125px;
    margin-bottom: 8px;
}

/* TITLE */
.title {
    font-size: 38px;
    margin-bottom: 22px;
}

/* LOGIN CARD */
.login-card {
    width: 540px;
    max-width: 92%;
    padding: 18px 24px 20px;
    border-radius: 16px;
}

/* LABELS */
.label {
    font-size: 15px;
    margin-bottom: 7px;
}

/* ROLES */
.roles {
    gap: 12px;
    margin-bottom: 12px;
}

.role {
    height: 52px;
    border-radius: 9px;
    padding: 0 11px;
}

.role-icon {
    width: 34px;
    height: 34px;
    font-size: 18px;
    margin-right: 9px;
}

.role-name {
    font-size: 16px;
}

.radio {
    width: 20px;
    height: 20px;
}

.role.active .radio::after {
    width: 9px;
    height: 9px;
    top: 3.5px;
    left: 3.5px;
}

/* INPUTS */
.input-group {
    margin-bottom: 11px;
}

.input-box {
    height: 48px;
    border-radius: 8px;
    padding: 0 11px;
}

.input-icon {
    width: 32px;
    font-size: 19px;
}

.input-box input {
    font-size: 14px;
}

.eye {
    font-size: 19px;
}

/* OPTIONS */
.options {
    margin: 3px 0 13px;
}

.remember {
    gap: 7px;
    font-size: 13px;
}

.remember input {
    width: 18px;
    height: 18px;
}

.forgot {
    font-size: 13px;
}

/* LOGIN BUTTON */
.login-btn {
    height: 50px;
    border-radius: 8px;
    font-size: 18px;
}

/* ================= SMALL SCREENS ================= */

@media (max-width: 700px) {

    .logo {
        width: 95px;
        height: 95px;
    }

    .title {
        font-size: 30px;
        margin-bottom: 18px;
    }

    .login-card {
        width: 100%;
        padding: 15px;
    }

    .roles {
        gap: 8px;
    }

    .role {
        height: 48px;
    }

    .role-name {
        font-size: 14px;
    }

    .role-icon {
        font-size: 16px;
        margin-right: 6px;
    }

    .label {
        font-size: 14px;
    }

    .login-btn {
        height: 48px;
        font-size: 17px;
    }
}
</style>
</head>

<body>

<!-- ANIMATED BACKGROUND -->

<div class="background">

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    <div class="shape shape4"></div>

    <div class="dots left"></div>
    <div class="dots right"></div>

</div>


<!-- MAIN -->

<div class="container">

    <!-- JRCC LOGO -->
    <img src="JRCC.png" class="logo" alt="JRCC Logo">

    <!-- TITLE -->
    <h1 class="title">JRCSEE Login</h1>


    <!-- LOGIN CARD -->

    <div class="login-card">

        <div class="label">Role</div>


        <!-- ROLES -->

        <div class="roles">

            <div class="role active" onclick="selectRole(this)">
                <div class="role-icon">♙</div>

                <div class="role-name">
                    Admin
                </div>

                <div class="radio"></div>
            </div>


            <div class="role" onclick="selectRole(this)">
                <div class="role-icon">♙</div>

                <div class="role-name">
                    Personnel
                </div>

                <div class="radio"></div>
            </div>

        </div>


        <!-- USERNAME -->

        <div class="input-group">

            <div class="label">
                Username
            </div>

            <div class="input-box">

                <div class="input-icon">
                    ♙
                </div>

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                >

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <div class="label">
                Password
            </div>

            <div class="input-box">

                <div class="input-icon">
                    🔒
                </div>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                >

                <div
                    class="eye"
                    onclick="togglePassword()"
                    id="eye"
                >
                    ◉
                </div>

            </div>

        </div>


        <!-- OPTIONS -->

        <div class="options">

            <label class="remember">

                <input
                    type="checkbox"
                    id="remember"
                >

                Remember me

            </label>


            <div class="forgot">
                Forgot password?
            </div>

        </div>


        <!-- LOGIN -->

        <button
            class="login-btn"
            onclick="login()"
        >
            LOGIN
        </button>

    </div>

</div>


<script>

/* ================= ROLE ================= */

let selectedRole = "admin";

function selectRole(element) {

    document
        .querySelectorAll(".role")
        .forEach(role => {
            role.classList.remove("active");
        });

    element.classList.add("active");

    selectedRole =
        element
        .querySelector(".role-name")
        .textContent
        .trim()
        .toLowerCase();
}


/* ================= PASSWORD ================= */

function togglePassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }
}


/* ================= LOGIN ================= */

async function login() {

    const email = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please enter your email and password.");
        return;
    }

    const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        alert("Login failed: " + error.message);
        return;
    }

    // Successful login
    window.location.href = "dashboard.html";
}



</script>

<script>
const supabase = window.supabase.createClient(

);
</script>

</body>
</html>
