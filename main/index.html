<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JRCSEE Login</title>
<link rel="icon" type="image/x-icon" href="JRCC.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #000;
    color: white;
    font-family: "Poppins", sans-serif;
    overflow: hidden;
}

/* ================= BACKGROUND ================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    background: #000;
}

.shape {
    position: absolute;
    width: 520px;
    height: 110px;
    background: linear-gradient(90deg, #08030f, #18052d, #08030f);
    transform: rotate(-50deg);
    opacity: .9;
    animation: floatShape 7s ease-in-out infinite alternate;
}

.shape::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    width: 4px;
    height: 100%;
    background: #7428ff;
    box-shadow:
        0 0 10px #7428ff,
        0 0 25px #7428ff,
        0 0 45px #4d00ff;
}

.shape1 { left: -160px; top: 20px; }
.shape2 { right: -190px; top: 180px; animation-delay: -2s; }
.shape3 { left: -170px; bottom: 40px; animation-delay: -4s; }
.shape4 { right: -170px; bottom: 70px; animation-delay: -1s; }

@keyframes floatShape {
    from { transform: rotate(-50deg) translateY(0); }
    to   { transform: rotate(-50deg) translateY(25px); }
}

.glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(105, 25, 255, .16), transparent 70%);
    filter: blur(20px);
    animation: glowMove 8s ease-in-out infinite alternate;
}

.glow1 { left: -250px; top: -200px; }
.glow2 { right: -250px; bottom: -200px; animation-delay: -4s; }

@keyframes glowMove {
    from { transform: scale(1); }
    to   { transform: scale(1.3) translate(40px, 20px); }
}

.dots {
    position: absolute;
    width: 110px;
    height: 190px;
    background-image: radial-gradient(circle, #6520ff 2px, transparent 2.5px);
    background-size: 25px 25px;
    animation: dotMove 4s ease-in-out infinite;
}

.dots.left  { left: 15px; top: 410px; }
.dots.right { right: 15px; top: 30px; }

@keyframes dotMove {
    0%, 100% { opacity: .35; transform: translateY(0); }
    50%      { opacity: .9;  transform: translateY(10px); }
}

/* ================= MAIN ================= */

.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.logo {
    width: 125px;
    height: 125px;
    object-fit: contain;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 5px rgba(255,200,50,.15));
}

.title {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 38px;
    font-weight: 800;
    margin-bottom: 22px;
    letter-spacing: .5px;
}

/* ================= LOGIN CARD ================= */

.login-card {
    width: 540px;
    max-width: 92%;
    padding: 18px 24px 20px;
    border-radius: 16px;
    background: rgba(8,8,13,.82);
    border: 2px solid rgba(105,40,210,.55);
    box-shadow:
        0 0 25px rgba(95,30,220,.08),
        inset 0 0 20px rgba(100,30,200,.03);
    backdrop-filter: blur(15px);
}

.label {
    font-size: 15px;
    margin-bottom: 7px;
}

/* ================= ROLES ================= */

.roles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
}

.role {
    height: 52px;
    border: 2px solid #3b3b42;
    border-radius: 9px;
    display: flex;
    align-items: center;
    padding: 0 11px;
    cursor: pointer;
    transition: .25s;
}

.role:hover { border-color: #762cff; }

.role.active {
    border-color: #7428ff;
    box-shadow: 0 0 12px rgba(115,40,255,.25);
}

.role-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 9px;
    font-size: 18px;
    color: white;
}

.role.active .role-icon {
    background: #6e25d9;
    box-shadow: 0 0 12px rgba(120,40,255,.5);
}

.role-name {
    font-size: 16px;
    font-weight: 500;
    flex: 1;
}

.radio {
    width: 20px;
    height: 20px;
    border: 2px solid #66666d;
    border-radius: 50%;
    position: relative;
}

.role.active .radio {
    border-color: #9b64ff;
    box-shadow: 0 0 8px rgba(130,60,255,.7);
}

.role.active .radio::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    background: white;
    border-radius: 50%;
    top: 3.5px;
    left: 3.5px;
}

/* ================= INPUT ================= */

.input-group { margin-bottom: 11px; }

.input-box {
    height: 48px;
    width: 100%;
    border: 2px solid #414147;
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 0 11px;
    transition: .25s;
}

.input-box:focus-within {
    border-color: #7029e8;
    box-shadow: 0 0 10px rgba(100,30,230,.2);
}

.input-icon {
    width: 32px;
    font-size: 19px;
    color: #ddd;
}

.input-box input {
    flex: 1;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 14px;
    font-family: "Poppins", sans-serif;
}

.input-box input::placeholder { color: #77777d; }

.eye {
    font-size: 19px;
    cursor: pointer;
    color: #ddd;
    user-select: none;
}

/* ================= OPTIONS ================= */

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 3px 0 13px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 600;
}

.remember input {
    width: 18px;
    height: 18px;
    accent-color: #7028e8;
}

.forgot {
    color: #8a3cff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

.forgot:hover { text-decoration: underline; }

/* ================= LOGIN BUTTON ================= */

.login-btn {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #5420c9, #7027e9, #5720cc);
    color: white;
    font-size: 18px;
    font-weight: 700;
    font-family: "Poppins", sans-serif;
    cursor: pointer;
    transition: .25s;
    box-shadow: 0 0 20px rgba(100,30,230,.15);
}

.login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(110,35,240,.4);
}

.login-btn:active { transform: translateY(0); }

.login-btn:disabled {
    opacity: .7;
    cursor: not-allowed;
    transform: none;
}

/* ================= SMALL SCREENS ================= */

@media (max-width: 700px) {
    .logo { width: 95px; height: 95px; }
    .title { font-size: 30px; margin-bottom: 18px; }
    .login-card { width: 100%; padding: 15px; }
    .roles { gap: 8px; }
    .role { height: 48px; }
    .role-name { font-size: 14px; }
    .role-icon { font-size: 16px; margin-right: 6px; }
    .label { font-size: 14px; }
    .remember { font-size: 13px; }
    .forgot { font-size: 13px; }
    .login-btn { height: 48px; font-size: 17px; }
}
</style>
</head>

<body>

<!-- ANIMATED BACKGROUND -->
<div class="background">
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    <div class="shape shape4"></div>

    <div class="dots left"></div>
    <div class="dots right"></div>
</div>

<!-- MAIN -->
<div class="container">

    <img src="JRCC.png" class="logo" alt="JRCC Logo">

    <h1 class="title">JRCSEE Login</h1>

    <div class="login-card">

        <div class="label">Role</div>

        <div class="roles">
            <div class="role active" onclick="selectRole(this)">
                <div class="role-icon">♙</div>
                <div class="role-name">Admin</div>
                <div class="radio"></div>
            </div>

            <div class="role" onclick="selectRole(this)">
                <div class="role-icon">♙</div>
                <div class="role-name">Personnel</div>
                <div class="radio"></div>
            </div>
        </div>

        <!-- EMAIL -->
        <div class="input-group">
            <div class="label">Email</div>
            <div class="input-box">
                <div class="input-icon">♙</div>
                <input type="email" id="username" placeholder="Email" autocomplete="username">
            </div>
        </div>

        <!-- PASSWORD -->
        <div class="input-group">
            <div class="label">Password</div>
            <div class="input-box">
                <div class="input-icon">🔒</div>
                <input type="password" id="password" placeholder="Password" autocomplete="current-password">
                <div class="eye" onclick="togglePassword()" id="eye">◉</div>
            </div>
        </div>

        <!-- OPTIONS -->
        <div class="options">
            <label class="remember">
                <input type="checkbox" id="remember">
                Remember me
            </label>

            <div class="forgot" onclick="forgotPassword()">Forgot password?</div>
        </div>

        <button class="login-btn" onclick="login()">LOGIN</button>

    </div>
</div>

<script>
/* ================= SUPABASE ================= */

const supabaseClient = window.supabase.createClient(
    "https://guhwlwhdssycjpobcmfk.supabase.co",
    "sb_publishable_7pWS_7AO3bfuqLhh5Gp_AA_Wn0cuUyB"
);

/* ================= ROLE ================= */

let selectedRole = "admin";

function selectRole(element) {
    document.querySelectorAll(".role").forEach(role => {
        role.classList.remove("active");
    });

    element.classList.add("active");

    selectedRole = element
        .querySelector(".role-name")
        .textContent.trim()
        .toLowerCase();
}

/* ================= PASSWORD ================= */

function togglePassword() {
    const password = document.getElementById("password");
    password.type = password.type === "password" ? "text" : "password";
}

/* ================= LOGIN ================= */

async function login() {
    const email = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const button = document.querySelector(".login-btn");

    if (!email || !password) {
        alert("Please enter your email and password.");
        return;
    }

    button.disabled = true;
    button.textContent = "PLEASE WAIT...";

    try {
        const { error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert("Login failed: " + error.message);
            return;
        }

        window.location.href = "./dashboard.html";
    } catch (err) {
        console.error(err);
        alert("Unable to connect to Supabase. Check your internet connection.");
    } finally {
        button.disabled = false;
        button.textContent = "LOGIN";
    }
}

/* ================= FORGOT PASSWORD ================= */

async function forgotPassword() {
    const email = document.getElementById("username").value.trim();

    if (!email) {
        alert("Enter your email first, then click 'Forgot password?'.");
        return;
    }

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email);

    if (error) {
        alert("Could not send reset email: " + error.message);
        return;
    }

    alert("Password reset email sent. Check your inbox.");
}

/* ================= ENTER KEY ================= */

document.addEventListener("keydown", e => {
    if (e.key === "Enter") login();
});
</script>

</body>
</html>
