<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JRCSEE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #05030a;
            --card: rgba(22, 12, 36, 0.75);
            --side: #080410;
            --fg: #ffffff;
            --mut: #a69bbd;
            --pri: #a855f7;
            --acc: #e9d5ff;
            --cy: #f3e8ff;
            --line: rgba(255, 255, 255, .09)
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%
        }

        body {
            background: radial-gradient(circle at 50% 0%, #2e1052 0%, var(--bg) 75%);
            background-attachment: fixed;
            color: var(--fg);
            font: 14px/1.5 Inter, sans-serif;
            overflow: hidden
        }

        button,
        input {
            font: inherit;
            color: inherit
        }

        button {
            background: none;
            border: 0;
            cursor: pointer
        }

        .mono {
            font-family: 'DM Mono', monospace
        }

        .disp {
            font-family: 'Barlow Condensed', sans-serif
        }

        .app {
            display: flex;
            height: 100vh;
            height: 100dvh
        }

        aside {
            width: 240px;
            flex-shrink: 0;
            background: linear-gradient(180deg, var(--side) 0%, #030106 100%);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            z-index: 40
        }

        .brand {
            padding: 28px 24px 20px;
            border-bottom: 1px solid var(--line)
        }

        .brand h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: .12em;
            line-height: 1;
            background: linear-gradient(135deg, #ffffff 0%, var(--acc) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .brand p {
            font-size: 9px;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--mut);
            margin-top: 8px
        }

        nav {
            flex: 1;
            padding: 20px 12px;
            overflow-y: auto
        }

        nav button {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--mut);
            font-weight: 500;
            margin-bottom: 2px;
            text-align: left;
            transition: all .2s
        }

        nav button:hover {
            color: var(--fg);
            background: rgba(255, 255, 255, .04)
        }

        nav button.on {
            background: linear-gradient(90deg, rgba(168, 85, 247, .32) 0%, rgba(243, 232, 255, .12) 100%);
            color: #ffffff;
            border: 1px solid rgba(233, 213, 255, .4)
        }

        nav button.on::after {
            content: "";
            margin-left: auto;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--acc);
            box-shadow: 0 0 8px var(--acc)
        }

        nav svg,
        .ic svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0
        }

        .user {
            padding: 16px;
            border-top: 1px solid var(--line);
            display: flex;
            gap: 12px;
            align-items: center
        }

        .av {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--pri), var(--cy));
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 700;
            color: #05030a;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(233, 213, 255, .4)
        }

        .user b {
            font-size: 12px;
            display: block
        }

        .user small {
            font-size: 10px;
            color: var(--mut)
        }

        .col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 0
        }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 24px;
            background: rgba(5, 3, 10, .85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line)
        }

        header h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: .06em;
            line-height: 1
        }

        header .grow {
            flex: 1;
            min-width: 0
        }

        header small {
            font-size: 10px;
            color: var(--mut)
        }

        .menu {
            display: none;
            color: var(--mut)
        }

        .search {
            position: relative
        }

        .search svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 13px;
            height: 13px;
            stroke: var(--mut);
            fill: none;
            stroke-width: 2
        }

        .search input {
            width: 176px;
            padding: 8px 16px 8px 32px;
            font-size: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08);
            outline: none;
            transition: border-color .2s
        }

        .search input:focus {
            border-color: var(--pri)
        }

        .bell {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08);
            color: var(--mut);
            display: grid;
            place-items: center
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px
        }

        .grid {
            display: grid;
            gap: 16px
        }

        .g2 {
            grid-template-columns: repeat(2, 1fr)
        }

        .g3 {
            grid-template-columns: 2fr 1fr
        }

        .card {
            background: linear-gradient(135deg, rgba(38, 18, 64, 0.65) 0%, rgba(10, 5, 18, 0.85) 100%);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 20px;
            min-width: 0;
            backdrop-filter: blur(12px)
        }

        .card h3 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .06em
        }

        .sub {
            font-size: 10px;
            color: var(--mut);
            margin: 4px 0 20px
        }

        .stat {
            position: relative;
            overflow: hidden;
            padding: 16px
        }

        .stat .l {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--mut)
        }

        .stat .v {
            font-size: 24px;
            font-weight: 700;
            margin: 12px 0 4px
        }

        .chg {
            float: right;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 99px;
            background: rgba(233, 213, 255, .15);
            color: var(--acc);
            border: 1px solid rgba(233, 213, 255, .3)
        }

        .stat .ic {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: grid;
            place-items: center
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start
        }

        .rng button {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            color: var(--mut)
        }

        .rng button.on {
            background: rgba(168, 85, 247, .25);
            color: #ffffff;
            border: 1px solid rgba(233, 213, 255, .4)
        }

        .leg {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            font-size: 10px;
            color: var(--mut)
        }

        .leg i {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px
        }

        svg.ch {
            width: 100%;
            height: auto;
            display: block
        }

        svg.ch text {
            font: 10px 'DM Mono', monospace;
            fill: var(--mut)
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-top: 10px;
            color: var(--mut)
        }

        .row b {
            color: var(--fg);
            font-family: 'DM Mono', monospace
        }

        .act {
            max-height: 215px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px
        }

        .a {
            display: flex;
            gap: 12px
        }

        .a .ic {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            flex-shrink: 0
        }

        .a p {
            font-size: 12px;
            line-height: 1.4
        }

        .a p span {
            color: var(--mut)
        }

        .a p em {
            font-style: normal;
            color: var(--acc)
        }

        .a small {
            font-size: 10px;
            color: var(--mut)
        }

        .tw {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }

        th {
            text-align: left;
            padding: 12px 16px;
            font: 600 10px 'DM Mono', monospace;
            letter-spacing: .1em;
            color: var(--mut);
            white-space: nowrap;
            border-bottom: 1px solid var(--line)
        }

        td {
            padding: 12px 16px;
            color: var(--mut);
            white-space: nowrap;
            border-bottom: 1px solid rgba(255, 255, 255, .03)
        }

        tr:last-child td {
            border: 0
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, .02)
        }

        td.n {
            color: var(--fg);
            font-weight: 500;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .pill {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            padding: 4px 8px;
            border-radius: 99px;
            font: 600 10px 'DM Mono', monospace
        }

        .pill::before {
            content: "";
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px
        }

        .bar div {
            flex: 1;
            height: 6px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .06);
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            border-radius: 99px
        }

        .empty {
            padding: 24px;
            text-align: center;
            color: var(--mut);
            font-size: 12px
        }

        .list .row {
            margin: 0;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, .03);
            font-size: 12px
        }

        .list .row span:first-child {
            color: var(--fg);
            font-weight: 500
        }

        .veil {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            backdrop-filter: blur(4px);
            z-index: 30
        }

        @media(max-width:1023px) {
            .g3 {
                grid-template-columns: 1fr
            }
        }

        @media(max-width:767px) {
            aside {
                position: fixed;
                inset: 0 auto 0 0;
                transform: translateX(-100%);
                transition: transform .2s
            }

            aside.open {
                transform: none
            }

            .open~.veil {
                display: block
            }

            .menu {
                display: block
            }

            .search {
                display: none
            }

            .g2 {
                grid-template-columns: 1fr
            }

            main {
                padding: 20px
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <aside id="side">
            <div class="brand">
                <h1 class="disp">JRCSEE</h1>
                <p class="mono">Research Portal</p>
            </div>
            <nav id="nav"></nav>
            <div class="user">
                <div class="av mono">AD</div>
                <div><b>Admin User</b><small class="mono">admin@jrcsee.org</small></div>
            </div>
        </aside>
        <div class="veil" id="veil"></div>
        <div class="col">
            <header>
                <button class="menu ic" id="menu" aria-label="Open menu"><svg viewBox="0 0 24 24" width="20" height="20"
                        stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round">
                        <path d="M4 6h16M4 12h16M4 18h16" />
                    </svg></button>
                <div class="grow">
                    <h2 class="disp" id="title"></h2><small class="mono" id="date"></small>
                </div>
                <label class="search ic"><svg viewBox="0 0 24 24" stroke-linecap="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg><input id="q" placeholder="Search..." aria-label="Search"></label>
                <button class="bell ic" aria-label="Notifications"><svg viewBox="0 0 24 24">
                        <path
                            d="M10.3 21a2 2 0 0 0 3.4 0M3.3 15.3A1 1 0 0 0 4 17h16a1 1 0 0 0 .7-1.7C19.4 14 18 12.5 18 8a6 6 0 0 0-12 0c0 4.500-1.400 6-2.700 7.300" />
                    </svg></button>
            </header>
            <main id="main"></main>
        </div>
    </div>
    <script>
        const GROWTH = [["Jan", 120, 45], ["Feb", 134, 52], ["Mar", 148, 61], ["Apr", 165, 55], ["May", 180, 78], ["Jun", 192, 90], ["Jul", 205, 83], ["Aug", 218, 95], ["Sep", 234, 102], ["Oct", 251, 118], ["Nov", 267, 125], ["Dec", 284, 140]].map(([m, a, b]) => ({ m, members: a, subs: b }));
        const ACT = [[1, "Dr. Elena Vasquez", "submitted report", "Quantum Computing Applications", "2m ago", "report"], [2, "Prof. Marco Reyes", "joined project", "Neural Interface Lab", "18m ago", "member"], [3, "System", "milestone reached", "Renewable Energy Grid Study", "1h ago", "milestone"], [4, "Dr. Aisha Nakamura", "created event", "Q1 Engineering Summit", "2h ago", "event"], [5, "James Okonkwo", "status updated", "Biomedical Sensor Array", "3h ago", "update"], [6, "Dr. Sofia Brennan", "submitted report", "Climate Modeling Framework", "5h ago", "report"], [7, "Prof. Liang Wei", "joined project", "Advanced Materials Lab", "Yesterday", "member"]].map(([id, user, action, subject, time, type]) => ({ id, user, action, subject, time, type }));
        const PROJ = [["Quantum Computing Applications", "Engineering", "Dr. E. Vasquez", "Active", 72, 8, "Mar 2027"], ["Neural Interface Lab", "Sciences", "Prof. M. Reyes", "Active", 45, 5, "Jun 2027"], ["Renewable Energy Grid Study", "Engineering", "Dr. K. Obi", "Active", 88, 12, "Feb 2027"], ["Biomedical Sensor Array", "Sciences", "J. Okonkwo", "Pending", 21, 4, "Sep 2027"], ["Climate Modeling Framework", "Research", "Dr. S. Brennan", "Active", 61, 7, "Apr 2027"], ["Advanced Materials Lab", "Engineering", "Prof. L. Wei", "Completed", 100, 9, "Dec 2026"], ["Educational AI Platform", "Education", "Dr. A. Nakamura", "On Hold", 34, 3, "Aug 2027"]].map(([name, cat, lead, status, prog, team, due]) => ({ name, cat, lead, status, prog, team, due }));
        const CAT = { Engineering: "#a855f7", Sciences: "#f3e8ff", Education: "#e9d5ff", Research: "#c084fc" };
        const ST = { Active: ["rgba(233,213,255,.18)", "#e9d5ff"], Pending: ["rgba(250,204,21,.18)", "#facc15"], Completed: ["rgba(168,85,247,.2)", "#f3e8ff"], "On Hold": ["rgba(244,63,94,.18)", "#fb7185"] };
        const AI = { report: "#e9d5ff", member: "#a855f7", milestone: "#facc15", event: "#f3e8ff", update: "#a69bbd" };
        const NAV = [["dashboard", "Dashboard", '<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>'], ["members", "Members", '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.100a4 4 0 0 1 0 7.800"/>'], ["reports", "Reports", '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zM14 2v4a2 2 0 0 0 2 2h4M8 13h8M8 17h8"/>']];
        const S = { tab: "dashboard", q: "", range: 12 };
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const $ = id => document.getElementById(id);
        const has = (t, q) => t.toLowerCase().includes(q.trim().toLowerCase());
        const icon = p => `<svg viewBox="0 0 24 24">${p}</svg>`;

        function area(d) {
            const W = 600, H = 210, L = 34, B = 24, T = 8, R = 6, iw = W - L - R, ih = H - T - B, max = Math.ceil(Math.max(...d.flatMap(x => [x.members, x.subs])) / 50) * 50;
            const X = i => L + (d.length > 1 ? i * iw / (d.length - 1) : iw / 2), Y = v => T + ih - v / max * ih;
            const line = k => d.map((x, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(x[k]).toFixed(1)}`).join("");
            const fill = (k, c, id) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stop-color="${c}" stop-opacity=".4"/><stop offset="95%" stop-color="${c}" stop-opacity="0"/></linearGradient><path d="${line(k)}L${X(d.length - 1)},${T + ih}L${X(0)},${T + ih}Z" fill="url(#${id})"/><path d="${line(k)}" fill="none" stroke="${c}" stroke-width="2"/>`;
            let g = ""; for (let i = 0; i <= 4; i++) { const v = max * i / 4, y = Y(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.04)"/><text x="${L - 6}" y="${y + 3}" text-anchor="end">${v}</text>` }
            const dots = k => d.map((x, i) => `<circle cx="${X(i)}" cy="${Y(x[k])}" r="6" fill="transparent"><title>${x.m} · ${k === "subs" ? "Submissions" : "Members"}: ${x[k]}</title></circle>`).join("");
            return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Members and submissions over time">${g}${d.map((x, i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${x.m}</text>`).join("")}${fill("members", "#a855f7", "gm")}${fill("subs", "#f3e8ff", "gs")}${dots("members")}${dots("subs")}</svg>`
        }

        function bars(d) {
            const W = 400, H = 190, L = 30, B = 22, T = 8, ih = H - T - B, max = Math.ceil(Math.max(...d.map(x => x.v)) / 50) * 50, bw = (W - L) / d.length; let s = "";
            for (let i = 0; i <= 4; i++) { const v = max * i / 4, y = T + ih - v / max * ih; s += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.04)"/><text x="${L - 6}" y="${y + 3}" text-anchor="end">${v}</text>` }
            s += `<defs><linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f3e8ff"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs>`;
            d.forEach((x, i) => { const h = x.v / max * ih, cx = L + bw * i + bw / 2; s += `<rect x="${cx - 12}" y="${T + ih - h}" width="24" height="${h}" rx="4" fill="url(#barG)"><title>${x.m}: ${x.v}</title></rect><text x="${cx}" y="${H - 6}" text-anchor="middle">${x.m}</text>` });
            return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly reports">${s}</svg>`
        }

        function donut(c) {
            const r = 62, C = 2 * Math.PI * r; let off = 0;
            const arcs = c.map(x => { const len = x.value / 100 * C, a = `<circle r="${r}" fill="none" stroke="${x.color}" stroke-width="26" stroke-dasharray="${Math.max(len - 3, 0)} ${C}" stroke-dashoffset="${-off}"><title>${x.name}: ${x.value}%</title></circle>`; off += len; return a }).join("");
            return `<svg class="ch" viewBox="-90 -90 180 180" style="height:170px" role="img" aria-label="Projects by category"><g transform="rotate(-90)">${arcs}</g></svg>`
        }

        function proj(list) { return `<div class="card" style="padding:0"><div style="padding:16px 20px;border-bottom:1px solid var(--line)"><h3 class="disp">PROJECT STATUS</h3><div class="sub mono" style="margin:2px 0 0">${list.length} of ${PROJ.length} projects</div></div><div class="tw"><table><thead><tr>${["#", "Project", "Category", "Lead", "Status", "Progress", "Team", "Due"].map(h => `<th>${h.toUpperCase()}</th>`).join("")}</tr></thead><tbody>${list.length ? list.map((p, i) => { const [bg, fg] = ST[p.status]; return `<tr><td class="mono">${String(i + 1).padStart(2, "0")}</td><td class="n">${esc(p.name)}</td><td>${p.cat}</td><td>${esc(p.lead)}</td><td><span class="pill" style="background:${bg};color:${fg};border:1px solid ${fg}33">${p.status}</span></td><td><div class="bar"><div><i style="width:${p.prog}\%;background:${p.prog === 100 ? "#e9d5ff" : "linear-gradient(90deg, #a855f7, #f3e8ff)"}"></i></div><span class="mono" style="font-size:10px">${p.prog}%</span></div></td><td class="mono" style="text-align:center">${p.team}</td><td class="mono">${p.due}</td></tr>` }).join("") : `<tr><td colspan="8" class="empty">No projects match your search.</td></tr>`}</tbody></table></div></div>` }

        function dash() {
            const list = PROJ.filter(p => has(`${p.name} ${p.lead} ${p.cat}`, S.q));
            const g = GROWTH.slice(-S.range), tot = GROWTH.at(-1).members, prev = GROWTH.at(-4).members, ch = ((tot - prev) / prev * 100).toFixed(1);
            const act = PROJ.filter(p => p.status === "Active").reduce((n, p) => n + p.team, 0);
            const cats = Object.entries(PROJ.reduce((o, p) => (o[p.cat] = (o[p.cat] || 0) + 1, o), {})).map(([name, n]) => ({ name, value: Math.round(n / PROJ.length * 100), color: CAT[name] }));
            const stat = (l, v, c, col, bg, ic) => `<div class="card stat"><span class="chg mono">▲ ${c}%</span><div class="l mono">${l}</div><div class="v mono">${v}</div><div class="sub mono" style="margin:0">vs last quarter</div><div class="ic" style="background:${bg};color:${col}">${icon(ic)}</div></div>`;
            const u = NAV[1][2];
            return `<div class="grid g2">${stat("Total members", tot.toLocaleString(), ch, "#e9d5ff", "rgba(168,85,247,.2)", u)}${stat("Members on active projects", act.toLocaleString(), "6.1", "#f3e8ff", "rgba(243,232,255,.18)", u)}</div>
<div class="grid g3"><div class="card"><div class="top"><div><h3 class="disp">ACTIVITY OVERVIEW</h3><div class="sub mono">Member growth &amp; report submissions</div></div><div class="rng">${[["3M", 3], ["6M", 6], ["1Y", 12]].map(([l, n]) => `<button class="mono ${S.range === n ? "on" : ""}" data-r="${n}">${l}</button>`).join("")}</div></div><div class="leg mono"><span><i style="background:#a855f7"></i>Members</span><span><i style="background:#f3e8ff"></i>Submissions</span></div>${area(g)}</div>
<div class="card"><h3 class="disp">CATEGORY BREAKDOWN</h3><div class="sub mono">Projects by discipline</div>${donut(cats)}${cats.map(c => `<div class="row"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${c.color};margin-right:8px"></i>${c.name}</span><b>${c.value}%</b></div>`).join("")}</div></div>
<div class="grid g2"><div class="card"><h3 class="disp">MONTHLY REPORTS</h3><div class="sub mono">Last 6 months</div>${bars(GROWTH.slice(-6).map(x => ({ m: x.m, v: x.subs })))}</div>
<div class="card"><h3 class="disp">RECENT ACTIVITY</h3><div class="sub mono">Latest updates</div><div class="act">${ACT.map(a => `<div class="a"><div class="ic" style="background:${AI[a.type]}22;color:${AI[a.type]}">${icon('<circle cx="12" cy="12" r="4"/>')}</div><div><p><b>${esc(a.user)}</b> <span>${a.action}</span> <em>${esc(a.subject)}</em></p><small class="mono">${a.time}</small></div></div>`).join("")}</div></div></div>${proj(list)}`
        }

        function members() {
            const m = {}; PROJ.forEach(p => (m[p.lead] = m[p.lead] || []).push(p.name));
            const r = Object.entries(m).filter(([n]) => has(n, S.q));
            return `<div class="card list"><h3 class="disp" style="margin-bottom:12px">PROJECT LEADS</h3>${r.length ? r.map(([n, l]) => `<div class="row"><span>${esc(n)}</span><span>${esc(l.join(", "))}</span></div>`).join("") : '<div class="empty">No members match your search.</div>'}</div>`
        }

        function reports() {
            const r = ACT.filter(a => a.type === "report" && has(a.user + " " + a.subject, S.q));
            return `<div class="card list"><h3 class="disp" style="margin-bottom:12px">SUBMITTED REPORTS</h3>${r.length ? r.map(a => `<div class="row"><span>${esc(a.subject)}</span><span>${esc(a.user)} ·${a.time}</span></div>`).join("") : '<div class="empty">No reports match your search.</div>'}</div>`
        }

        function render() {
            $("title").textContent = NAV.find(n => n[0] === S.tab)[1].toUpperCase();
            $("nav").innerHTML = NAV.map(([id, l, p]) => `<button class="${S.tab === id ? "on" : ""}" data-t="${id}">${icon(p)}${l}</button>`).join("");
            $("main").innerHTML = { dashboard: dash, members, reports }[S.tab]();
        }
        $("date").textContent = new Date().toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
        $("nav").onclick = e => { const b = e.target.closest("[data-t]"); if (b) { S.tab = b.dataset.t; $("side").classList.remove("open"); render() } };
        $("main").onclick = e => { const b = e.target.closest("[data-r]"); if (b) { S.range = +b.dataset.r; render() } };
        $("q").oninput = e => { S.q = e.target.value; const y = $("main").scrollTop; render(); $("main").scrollTop = y };
        $("menu").onclick = () => $("side").classList.add("open");
        $("veil").onclick = () => $("side").classList.remove("open");
        render();
    </script>
</body>

</html>
