<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Members - JRCSEE</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #05030a; 
            --side: #080410; 
            --fg: #ffffff; 
            --mut: #8b80a6; 
            --pri: #7c3aed; 
            --acc: #c084fc; 
            --cy: #d8b4fe;
            --line: rgba(255,255,255,.09); 
            --card: rgba(22,12,36,0.75);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: radial-gradient(circle at 50% 0%, #1e0938 0%, var(--bg) 75%); 
            background-attachment: fixed;
            color: var(--fg); 
            font: 14px/1.5 Inter, sans-serif; 
            height: 100vh; 
            overflow: hidden; 
        }
        .app { display: flex; height: 100vh; }
        aside { 
            width: 240px; 
            background: linear-gradient(180deg, var(--side) 0%, #030106 100%); 
            border-right: 1px solid var(--line); 
            display: flex; 
            flex-direction: column; 
        }
        .brand { padding: 28px 24px 20px; border-bottom: 1px solid var(--line); }
        .brand h1 { 
            font-family: 'Barlow Condensed'; 
            font-size: 30px; 
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, var(--acc) 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        nav { flex: 1; padding: 20px 12px; }
        nav a { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            width: 100%; 
            padding: 10px 12px; 
            border-radius: 8px; 
            color: var(--mut); 
            text-decoration: none; 
            margin-bottom: 2px; 
            transition: all .2s;
        }
        nav a:hover {
            color: var(--fg);
            background: rgba(255, 255, 255, .04);
        }
        nav a.on { 
            background: linear-gradient(90deg, rgba(124,58,237,.28) 0%, rgba(192,132,252,.1) 100%); 
            color: #ffffff; 
            border: 1px solid rgba(168,85,247,.35); 
        }
        .col { flex: 1; display: flex; flex-direction: column; }
        header { 
            padding: 16px 24px; 
            background: rgba(5,3,10,.85); 
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line); 
        }
        header h2 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: .06em;
        }
        main { flex: 1; overflow-y: auto; padding: 24px; }
        .card { 
            background: linear-gradient(135deg, rgba(28,14,48,0.6) 0%, rgba(10,5,18,0.85) 100%); 
            border: 1px solid var(--line); 
            border-radius: 12px; 
            padding: 20px; 
            backdrop-filter: blur(12px);
        }
        .row { 
            display: flex; 
            justify-content: space-between; 
            padding: 12px 0; 
            border-bottom: 1px solid rgba(255,255,255,.03); 
        }
    </style>
</head>
<body>
    <div class="app">
        <aside>
            <div class="brand"><h1>JRCSEE</h1><p style="font-size:9px; color:var(--mut); font-family: 'DM Mono', monospace; letter-spacing: .25em; margin-top: 8px;">RESEARCH PORTAL</p></div>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/members" class="on">Members</a>
                <a href="/reports">Reports</a>
            </nav>
        </aside>
        <div class="col">
            <header><h2>PROJECT LEADS &amp; MEMBERS</h2></header>
            <main>
                <div class="card" id="member-list">
                    <p style="color:var(--mut);">Loading members from C++ server...</p>
                </div>
            </main>
        </div>
    </div>

    <script>
        fetch('/api/projects')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('member-list');
                container.innerHTML = '<h3 style="margin-bottom:12px; color:var(--acc); font-family: \'Barlow Condensed\', sans-serif; letter-spacing: .06em;">ACTIVE LEADS</h3>';
                data.forEach(item => {
                    container.innerHTML += `<div class="row"><span><strong style="color:var(--fg);">${item.lead}</strong></span><span style="color:var(--mut);">${item.name}</span></div>`;
                });
            });
    </script>
</body>
</html>
